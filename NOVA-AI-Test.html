<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA AI TEST</title><style>body{font:17px system-ui;background:#101722;color:#eef3fa;max-width:580px;margin:auto;padding:24px}article{background:#1c293b;padding:20px;border-radius:18px}button,input{font:inherit;border:0;border-radius:10px;padding:14px;margin:7px 0;width:100%;box-sizing:border-box}button{background:#8db6ff;color:#101722;font-weight:bold}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9c6d8}</style><h1>NOVA AI</h1><p>اختبار المحرك المحلي • iPad</p><article><button id="check">1. فحص التوافق</button><button id="load" disabled>2. تحميل النموذج</button><pre id="status" role="status">بانتظار الفحص</pre><small>قد يتطلب التحميل مئات الميغابايت أو أكثر. استخدم Wi-Fi. لا ترسل معلومات شخصية.</small></article><h2>محادثة تجريبية مع عمر</h2><input id="msg" placeholder="مثلاً: كيف حالك اليوم؟" maxlength="400"><button id="send" disabled>إرسال</button><pre id="chat"></pre><script type="module">const $=id=>document.getElementById(id);let engine,history=[];const status=t=>$('status').textContent=t;$('check').onclick=async()=>{try{if(!isSecureContext)throw Error('تحتاج صفحة HTTPS في Safari؛ فتح الملف مباشرة قد لا يعمل.');if(!navigator.gpu)throw Error('WebGPU غير متاح في هذا المتصفح.');const a=await navigator.gpu.requestAdapter();if(!a)throw Error('لم يتم العثور على معالج رسومي متوافق.');status('نجح فحص WebGPU الأولي. لا يضمن ذلك نجاح تحميل النموذج.');$('load').disabled=false}catch(e){status(e.message)}};$('load').onclick=async()=>{ $('load').disabled=true;try{status('جارٍ استيراد المحرك...');const w=await import('https://esm.run/@mlc-ai/web-llm');const model=w.prebuiltAppConfig.model_list.find(x=>x.model_id.startsWith('Qwen2.5-0.5B-Instruct-q4f16'));if(!model)throw Error('النموذج المطلوب غير موجود في قائمة المكتبة الحالية.');engine=await w.CreateMLCEngine(model.model_id,{initProgressCallback:r=>status(r.text)});status('تم تحميل النموذج.');$('send').disabled=false}catch(e){status('تعذر التحميل: '+e.message);$('load').disabled=false}};$('send').onclick=async()=>{const v=$('msg').value.trim();if(!v||!engine)return;$('send').disabled=true;$('msg').value='';$('chat').textContent+='\nأنت: '+v+'\n';try{const r=await engine.chat.completions.create({messages:[{role:'system',content:'أنت عمر، أخ خيالي في لعبة حياة عائلية آمنة. أجب بالعربية بجملة قصيرة عن الحياة اليومية. لا تقدم تعليمات خطرة.'},...history,{role:'user',content:v}],max_tokens:100,temperature:.7});const reply=r.choices[0].message.content;history=[...history,{role:'user',content:v},{role:'assistant',content:reply}].slice(-8);$('chat').textContent+='عمر: '+reply+'\n'}catch(e){status('تعذر توليد الرد: '+e.message)}finally{$('send').disabled=false}};</script></html>
